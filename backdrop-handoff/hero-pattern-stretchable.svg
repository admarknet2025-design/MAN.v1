<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 100 100" preserveAspectRatio="none">
<title>DMC 2026 hero pattern (homepage, desktop default state)</title>
<defs>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
<stop offset="0" stop-color="#0D0D0D" stop-opacity="0.6"/>
<stop offset="1" stop-color="#0D0D0D" stop-opacity="0"/>
</linearGradient>
</defs>
<rect id="background" x="0" y="0" width="100" height="100" fill="#0D0D0D"/>
<polygon id="g1-build-teal" points="35,0 100,0 100,55 10,0" fill="#2A7B74" fill-opacity="0.85"/>
<polygon id="g2-pulse-coral" points="20,0 100,40 100,75 0,95" fill="#D95F45" fill-opacity="0.8"/>
<polygon id="g3-akan-gold" points="0,70 100,68 100,100 0,100" fill="#C9A24A" fill-opacity="0.75"/>
<polygon id="g4-obsidian" points="0,85 60,75 100,100 0,100" fill="#1C1C1C" fill-opacity="0.5"/>
<rect id="left-fade" x="0" y="0" width="100" height="100" fill="url(#fade)"/>
</svg>
