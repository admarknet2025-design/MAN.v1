<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DMC Live · Screen</title>
<link rel="stylesheet" href="/assets/tools.css?v=5460c468">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* DMC Live projector, in the flyers' look (assets/tools.css). 16:9 stage: 80rem x 45rem, scaled to fit the projector (24px per rem at
   1920x1080). Akan Gold is an accent only (rule D-09 retired 14 Nov 2026 at the organiser's request): the pill's dot, the foil SCALE,
   hairlines and chip squares. */
html{font-size:min(1.25vw,2.2222vh);background:#000}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--cr);font:500 1.15rem/1.3 var(--fB);width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;cursor:none}
#stage{position:relative;width:80rem;height:45rem;background:var(--ink);overflow:hidden;--ac:#2A7B74;--act:#5C9890}
#planes{left:40rem;top:0;width:40rem;height:36.4rem}
.disp{font-family:var(--fD);font-weight:900;letter-spacing:-.01em}
#top{position:absolute;left:2.67rem;right:2.67rem;top:1.5rem;display:flex;align-items:center;gap:1.4rem;z-index:2}
#top .dmc-pill{font-size:.78rem}
#top .mini{font-size:1.25rem}
#rehearsal{position:absolute;left:50%;top:-1.5rem;transform:translateX(-50%);background:var(--co);color:var(--ob);font:800 .9rem/1 var(--fB);letter-spacing:.14em;padding:.45rem 1.2rem;display:none;z-index:9}
#join{position:absolute;right:0;top:.45rem;font:700 1rem/1 var(--fB);letter-spacing:.06em;color:var(--cr72);z-index:2}
.count{position:absolute;right:0;top:2.1rem;font:700 .95rem/1 var(--fB);letter-spacing:.06em;color:var(--cr60);z-index:2}
#view{position:absolute;left:0;right:0;top:4.9rem;bottom:9.6rem;padding:0 2.67rem;z-index:1}
/* the flat band (assets/partner-band.js), built at 1920 wide and scaled with the stage; holds the contracted sponsor credit */
#band{position:absolute;left:0;bottom:0;width:1920px;transform-origin:left bottom;z-index:3}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
h1.prompt{font:800 2.3rem/1.12 var(--fB);max-width:52rem;margin-top:.7rem}
.tag{font-size:.95rem;--chip:var(--ac)}
/* holding */
.hold{height:100%;display:grid;grid-template-columns:1fr 18.5rem;align-items:center;gap:3rem}
.hold .dmc-eyebrow{font-size:.85rem}
.hold .dmc-head{font-size:5.4rem;margin:.5rem 0 1.4rem}
.hold h2{font:800 2.2rem/1.1 var(--fB)}
.hold p{font-size:1.35rem;color:var(--cr72);margin-top:.6rem;max-width:36rem}
.hold .now{margin-top:1.6rem;display:flex;align-items:center;gap:.9rem;font:700 1.25rem/1.25 var(--fB);max-width:38rem}
.qrbox{background:var(--cr);color:var(--ob);border-radius:1.1rem;padding:1.2rem 1.2rem 1rem;box-shadow:0 1.3rem 2.4rem rgba(0,0,0,.58),0 .25rem .45rem rgba(0,0,0,.36);position:relative;z-index:2}
.qrbox::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.2) 45%,rgba(255,255,255,0) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.qrbox svg{display:block;width:100%;height:auto}
.qrbox .l{font:700 .7rem/1 var(--fB);letter-spacing:.14em;text-transform:uppercase;color:var(--te);margin-top:.8rem;text-align:center}
.qrbox .u{font:800 1.05rem/1.2 var(--fB);text-align:center;margin-top:.3rem}
/* word cloud */
.cloudwrap{position:relative;width:100%;flex:1 1 0;min-height:0;margin-top:.8rem;margin-bottom:.4rem}
.cloudview{height:100%;display:flex;flex-direction:column;align-items:flex-start}
.cloudview .cloudwrap{align-self:stretch}
.w{position:absolute;white-space:nowrap;line-height:.92;font-family:var(--fD);font-weight:900;letter-spacing:-.01em;text-transform:uppercase;transition:left .9s ease,top .9s ease,font-size .9s ease,opacity .6s ease,transform .6s ease,color .6s ease;transform-origin:left top}
.w.new{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
/* finale */
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;height:100%}
.fin .col{position:relative;padding-top:.4rem}
.fin .col .dmc-chip{font-size:.9rem}
.fin .col{display:flex;flex-direction:column;align-items:flex-start}
.fin .cloudwrap{align-self:stretch}
/* Q&A */
.qlist{list-style:none;padding:0;display:grid;gap:.75rem;margin-top:1rem;max-width:58rem}
.qlist li{display:grid;grid-template-columns:5.5rem 1fr;gap:1.2rem;align-items:center;background:rgba(255,255,255,.05);border-top:2px solid rgba(201,162,74,.18);padding:.85rem 1.2rem}
.qlist .v{font:900 2.5rem/1 var(--fD);text-align:center;color:var(--act)}
.qlist .v small{display:block;font:700 .55rem/1 var(--fB);letter-spacing:.2em;color:var(--cr60);margin-top:.35rem}
.qlist .t{font:700 1.5rem/1.2 var(--fB)}
.qlist .t small{display:block;font:600 .9rem/1.2 var(--fB);color:var(--cr60);margin-top:.3rem;letter-spacing:.04em}
.iview .qlist .t{font-size:2rem;line-height:1.12}
.iview .qlist li{padding:1rem 1.5rem;grid-template-columns:7rem 1fr}
.iview .qlist .v{font-size:3.2rem}
.pin{display:inline-block;font:700 .6rem/1 var(--fB);letter-spacing:.14em;background:var(--go);color:var(--ob);padding:.25rem .45rem;margin-right:.6rem;vertical-align:.3em}
/* poll */
.bars{display:grid;gap:.9rem;margin-top:1.3rem;max-width:56rem}
.bar{position:relative;background:rgba(255,255,255,.05);border-top:2px solid rgba(201,162,74,.18);height:4.2rem;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ac);transition:width .9s ease;opacity:.95}
.bar span{position:absolute;left:1.2rem;top:50%;transform:translateY(-50%);font:800 1.6rem/1 var(--fB);color:var(--cr);text-shadow:0 0 .4rem var(--ob)}
.bar b{position:absolute;right:1.2rem;top:50%;transform:translateY(-50%);font:900 2.2rem/1 var(--fD);color:var(--cr);text-shadow:0 0 .4rem var(--ob)}
.swing{display:grid;grid-template-columns:1fr 1fr;gap:2rem;max-width:72rem}
.swing h2{font:700 .9rem/1 var(--fB);letter-spacing:.2em;text-transform:uppercase;margin-top:1rem;color:var(--cr60)}
.shift{position:absolute;right:0;top:0;text-align:right;z-index:2}
.shift b{display:block;font:900 4.6rem/1 var(--fD);color:var(--act)}
.shift span{font:700 .95rem/1.2 var(--fB);letter-spacing:.14em;text-transform:uppercase;color:var(--cr72)}
.total{font:700 1rem/1 var(--fB);color:var(--cr60);margin-top:1rem;letter-spacing:.04em}
/* wall */
.wallbox{position:absolute;left:2.67rem;right:2.67rem;top:7.2rem;bottom:0;overflow:hidden;mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent)}
.wallcol{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1.2rem;animation:scroll var(--dur,60s) linear infinite}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.wi{background:rgba(255,255,255,.05);border-top:2px solid rgba(201,162,74,.18);padding:.85rem 1.1rem}
.wi b{display:block;font:700 .75rem/1 var(--fB);letter-spacing:.14em;text-transform:uppercase;color:var(--act);margin-bottom:.4rem}
.wi span{font:700 1.3rem/1.2 var(--fB)}
/* takeaways: Brief sheets */
.tks{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem;margin-top:1.3rem}
.tk{padding:1.2rem 1.3rem 1.1rem;min-height:9rem}
.tk q{display:block;font:800 1.45rem/1.2 var(--fB);quotes:'\201C' '\201D'}
.tk .dmc-rule{margin:.9rem 0 .6rem;border-top-width:2px}
.tk b{display:block;font:700 .8rem/1 var(--fB);letter-spacing:.14em;text-transform:uppercase;color:var(--te)}
.bigq{height:100%;display:flex;flex-direction:column;justify-content:center;max-width:62rem}
.bigq .mark{font:900 7rem/.6 var(--fD);color:var(--go);height:3.2rem}
.bigq q{font:800 3rem/1.12 var(--fB);quotes:none}
.bigq .who{margin-top:1.6rem;display:flex;align-items:center;gap:1rem}
.bigq b{font:800 1.6rem/1.1 var(--fB)}
.bigq small{display:block;margin-top:.3rem;font:600 1rem/1.2 var(--fB);color:var(--cr72)}
</style>
</head>
<body>
<div id="stage">
  <div class="dmc-planes drift" id="planes" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="fade"></i></div>
  <header id="top"><div id="rehearsal">REHEARSAL</div><span class="dmc-pill">DMC 2026 · Accra</span><span class="dmc-head mini">Built to <span class="s dmc-foil">Scale</span></span><div id="join"></div><div class="count" id="count"></div></header>
  <main id="view" aria-live="polite" aria-label="DMC Live"></main>
  <footer id="band"></footer>
</div>
<script src="/assets/live-qr.js?v=b758bd41"></script>
<script src="/assets/sponsor/config.js?v=dd74c25a"></script>
<script src="/assets/sponsor/lockup.js?v=6c477705"></script>
<script src="/assets/partner-band.js?v=47aa1c36"></script>
<script>
/* the flyers' band at the foot of every view: POWERED BY MojoPay (16% of the stage width, the contract default) with "Tickets
   exclusively on MojoLife", ORGANIZED BY M·A·N, IN PARTNERSHIP WITH the seven partners. Built at 1920 wide, scaled with the stage. */
(function () {
  var band = document.getElementById('band'), stage = document.getElementById('stage');
  window.DMCBand.mount(band, { width: 1920, padX: 64, rowGap: 14 });
  function fit() { band.style.transform = 'scale(' + (stage.offsetWidth / 1920) + ')'; }
  fit(); window.addEventListener('resize', fit);
})();
</script>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function h(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); });
  (function add(list) { for (var i = 0; i < list.length; i++) { var c = list[i]; if (c == null || c === false) continue; if (Array.isArray(c)) add(c); else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); } }(Array.prototype.slice.call(arguments, 2)));
  return e;
}
var view = $('view'), cur = '', ST = null;
var ACC = { 'Build Yourself': '#2A7B74', 'Build Your Team': '#D95F45', 'Build Your Work': '#F4EFE6' };
/* --ac fills (bars, chip squares); --act is the same accent as text on obsidian (teal is too dark to read, so the flyers' lighter teal) */
var TEXT_AC = { '#2A7B74': '#5C9890', '#D95F45': '#D95F45', '#F4EFE6': '#F4EFE6' };
function setAc(c) { c = c || '#2A7B74'; $('stage').style.setProperty('--ac', c); $('stage').style.setProperty('--act', TEXT_AC[c] || '#F4EFE6'); }
function darkTag() { return ''; }
function chip(text, c) { var e = h('span', { class: 'dmc-chip on-dark tag', text: text }); if (c) e.style.setProperty('--chip', c); return e; }

/* ---- QR ---- */
/* where the QR points: mangh.org in production; on a preview or a local copy, that copy (so the code opens what you are looking at) */
var JOIN_URL = (/^(www\.)?mangh\.org$/.test(location.hostname) ? 'https://mangh.org' : location.origin) + '/live';
var JOIN = JOIN_URL.replace(/^https?:\/\//, '');
document.getElementById('join').textContent = JOIN;
function qrSvg(text, px) {
  var q = window.qrcode(0, 'M'); q.addData(text); q.make();
  var n = q.getModuleCount(), d = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 ' + n + ' ' + n); s.setAttribute('shape-rendering', 'crispEdges'); s.setAttribute('role', 'img'); s.setAttribute('aria-label', 'QR code for ' + text);
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); p.setAttribute('fill', '#1C1C1C'); s.appendChild(p); return s;
}

/* ---- word cloud: biggest in the middle, no overlaps, glides to new places as words arrive ---- */
var measureCtx = document.createElement('canvas').getContext('2d');
/* every word must show: if any does not fit, lay the whole cloud out again at a smaller scale (the expanded face is wide) */
function cloudLayout(words, W, H, rem) {
  var out = [];
  for (var k = 1, i = 0; i < 8; i++, k *= 0.86) {
    out = cloudPass(words, W, H, rem, k);
    if (out.length >= words.length) break;
  }
  return out;
}
function cloudPass(words, W, H, rem, k) {
  var max = Math.max.apply(null, words.map(function (w) { return w.n; }).concat([1])), min = Math.min.apply(null, words.map(function (w) { return w.n; }).concat([max]));
  var big = Math.min(H * 0.34, rem * 6.4) * k, small = Math.max(rem * 0.9, rem * 1.5 * k);
  var placed = [], out = [];
  words.slice().sort(function (a, b) { return b.n - a.n || a.w.localeCompare(b.w); }).forEach(function (w) {
    var t = max === min ? 1 : Math.sqrt((w.n - min) / (max - min));
    var size = small + (big - small) * t;
    var box;
    for (var tries = 0; tries < 3; tries++) {
      measureCtx.font = '900 ' + size + 'px "DMC Archivo D", Archivo, sans-serif';
      var tw = measureCtx.measureText(w.w.toUpperCase()).width * 0.99, th = size * 0.92;
      var a = 0, found = null;
      while (a < 900 && !found) {
        var r = a * 0.9, ang = a * 0.35;
        var x = W / 2 + r * Math.cos(ang) * 1.9 - tw / 2, y = H / 2 + r * Math.sin(ang) * 0.9 - th / 2;
        a++;
        if (x < 0 || y < 0 || x + tw > W || y + th > H) continue;
        var hit = placed.some(function (p) { return !(x + tw + 8 < p.x || x > p.x + p.w + 8 || y + th + 6 < p.y || y > p.y + p.h + 6); });
        if (!hit) found = { x: x, y: y, w: tw, h: th };
      }
      if (found) { box = found; break; }
      size *= 0.82;
    }
    if (box) { placed.push(box); out.push({ w: w.w, n: w.n, x: box.x, y: box.y, size: size, rank: out.length, t: t }); }
  });
  return out;
}
function drawCloud(wrap, words, accent) {
  var W = wrap.clientWidth, H = wrap.clientHeight, rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  var els = wrap._els || (wrap._els = {});
  var lay = cloudLayout(words, W, H, rem), seen = {};
  lay.forEach(function (p) {
    seen[p.w] = 1;
    var e = els[p.w];
    if (!e) { e = els[p.w] = h('span', { class: 'w new', text: p.w }); wrap.appendChild(e); e.style.left = p.x + 'px'; e.style.top = p.y + 'px'; e.style.fontSize = p.size + 'px'; }
    e.style.left = p.x + 'px'; e.style.top = p.y + 'px'; e.style.fontSize = p.size + 'px';
    /* the three most-sent words in the movement colour, the rest in cream, quieter as they get rarer */
    e.style.color = p.rank < 3 ? (TEXT_AC[accent] || '#F4EFE6') : '#F4EFE6';
    e.style.opacity = p.rank < 3 ? 1 : (0.62 + 0.38 * p.t).toFixed(2);
  });
  Object.keys(els).forEach(function (k) { if (!seen[k]) { els[k].remove(); delete els[k]; } });
}

/* ---- modes ---- */
var modes = {
  holding: function (st) {
    var root = h('div', { class: 'hold fade' });
    var head = h('h1', { class: 'dmc-head' }, 'Built', h('br'), 'to', h('br'), h('span', { class: 's dmc-foil live', text: 'Scale' }));
    var left = h('div', null, h('div', { class: 'dmc-eyebrow', text: 'Digital Marketers’ Conference' }), head, h('h2', { text: 'Scan to join' }),
      h('p', { text: 'Questions, polls, word clouds and your own quote cards, from your phone. No app, no login.' }));
    if (st.session) left.appendChild(h('div', { class: 'now' }, chip('Now', st.session.accent), h('span', { text: st.session.title })));
    var box = h('div', { class: 'qrbox' }, qrSvg(JOIN_URL), h('div', { class: 'l', text: 'Scan to join' }), h('div', { class: 'u', text: JOIN }));
    root.append(left, box); setAc(st.session ? st.session.accent : '#2A7B74'); return { el: root };
  },
  cloud: function (st) {
    var c = st.cloud; setAc(c.accent);
    var wrap = h('div', { class: 'cloudwrap' });
    var root = h('div', { class: 'fade cloudview' }, chip(c.movement, c.accent), h('h1', { class: 'prompt', text: c.prompt }), wrap);
    return { el: root, update: function (s) { drawCloud(wrap, s.cloud.words, s.cloud.accent); $('count').textContent = s.cloud.words.reduce(function (a, w) { return a + w.n; }, 0) + ' words'; }, after: function (s) { this.update(s); } };
  },
  finale: function (st) {
    var wraps = [];
    var root = h('div', { class: 'fin fade' }, h('h1', { class: 'sr', text: 'Word clouds from the room' }));
    st.clouds.forEach(function (c) {
      var wrap = h('div', { class: 'cloudwrap' }); wraps.push(wrap);
      var col = h('div', { class: 'col' }, chip(c.movement, c.accent), wrap); root.appendChild(col);
    });
    return { el: root, update: function (s) { s.clouds.forEach(function (c, i) { drawCloud(wraps[i], c.words, c.accent); }); }, after: function (s) { this.update(s); } };
  },
  qa: function (st, interview) {
    setAc(st.session ? st.session.accent : '#2A7B74');
    var list = h('ul', { class: 'qlist' });
    var root = h('div', { class: 'fade' + (interview ? ' iview' : ''), style: 'height:100%' }, chip(interview ? 'Interview mode · top questions' : 'Ask the panel', st.session && st.session.accent),
      h('h1', { class: 'prompt', text: st.title || 'Questions from the room', style: 'font-size:' + (interview ? '1.9rem' : '2.05rem') }), list);
    function fill(s) {
      list.textContent = '';
      if (!s.questions.length) list.appendChild(h('li', null, h('div', { class: 'v', text: '?' }), h('div', { class: 't', text: 'Send your question at ' + JOIN })));
      s.questions.forEach(function (q) { list.appendChild(h('li', null, h('div', { class: 'v' }, String(q.votes), h('small', { text: 'VOTES' })), h('div', { class: 't' }, q.pinned ? h('span', { class: 'pin', text: 'PINNED' }) : null, q.text, h('small', { text: q.name })))); });
    }
    fill(st);
    return { el: root, update: fill };
  },
  interview: function (st) { return modes.qa(st, true); },
  poll: function (st) {
    var p = st.poll; if (!p) return modes.holding(st);
    setAc(st.session ? st.session.accent : '#2A7B74');
    var root = h('div', { class: 'fade', style: 'height:100%;position:relative' });
    var inner = h('div'); root.appendChild(inner);
    function bars(p2, title) {
      var box = h('div'); if (title) box.appendChild(h('h2', { text: title }));
      var total = p2.total || 0, bw = h('div', { class: 'bars' });
      p2.options.forEach(function (o, i) {
        var pct = total && p2.counts ? Math.round(p2.counts[i] / total * 100) : 0;
        var bar = h('div', { class: 'bar' }, h('i', { style: 'width:' + (p2.counts ? pct : 0) + '%' }), h('span', { text: o }), h('b', { text: p2.counts ? pct + '%' : '' }));
        bw.appendChild(bar);
      });
      box.appendChild(bw); box.appendChild(h('div', { class: 'total', text: p2.counts ? total + ' answers' : p2.open ? 'Voting is open: ' + JOIN : '' }));
      return box;
    }
    function fill(s) {
      inner.textContent = '';
      var q = s.poll;
      inner.appendChild(chip(s.swing ? 'The swing' : 'Live poll', st.session && st.session.accent));
      inner.appendChild(h('h1', { class: 'prompt', text: q.question, style: 'font-size:2.15rem' }));
      if (s.swing && s.before) {
        var sw = h('div', { class: 'shift' }, h('b', { text: s.swing.pct + '%' }), h('span', { text: 'changed their minds' }));
        inner.appendChild(sw);
        inner.appendChild(h('div', { class: 'swing' }, bars(s.before, 'Before'), bars(q, 'After')));
      } else inner.appendChild(bars(q, ''));
    }
    fill(st);
    return { el: root, update: fill };
  },
  wall: function (st) {
    setAc(st.session ? st.session.accent : '#2A7B74');
    var root = h('div', { class: 'fade', style: 'height:100%' }, chip('The Build Wall', st.session && st.session.accent), h('h1', { class: 'prompt', text: 'What are you building?' }));
    var box = h('div', { class: 'wallbox' }); root.appendChild(box);
    var key = '';
    function fill(s) {
      var k = JSON.stringify(s.wall); if (k === key) return; key = k; box.textContent = '';
      if (!s.wall.length) { box.appendChild(h('p', { style: 'font:700 1.6rem/1.3 var(--fB);color:var(--cr72)', text: 'Add yours at ' + JOIN })); return; }
      var col = h('div', { class: 'wallcol' });
      var items = s.wall.slice().reverse();
      var rows = items.concat(items);
      rows.forEach(function (w) { col.appendChild(h('div', { class: 'wi' }, h('b', { text: w.name }), h('span', { text: w.line }))); });
      col.style.setProperty('--dur', Math.max(30, items.length * 4) + 's');
      box.appendChild(col);
    }
    fill(st);
    return { el: root, update: fill };
  },
  takeaways: function (st) {
    setAc(st.session ? st.session.accent : '#2A7B74');
    var grid = h('div', { class: 'tks' });

/* a later full-screen takeover (for example a session-wide activity) registers here, one function per takeover type returning { el, update?, after? }: none are built yet */
var TAKEOVERS = {};
function render(st) {

  var key = (tk ? 'takeover:' + st.takeover.type + ':' : '') + st.mode + ':' + (st.cloud ? st.cloud.id : '') + (st.poll ? st.poll.id : '') + (st.quote ? st.quote.text : '') + (st.mode === 'qa' || st.mode === 'interview' ? st.title : '');
